<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>AWS GenAI 刷题</title><style>:root{--bg:#fff;--ink:#111418;--ink2:#3d434b;--mut:#8b9098;--rule:#ebedf0;--soft:#f6f7f8;--acc:#0e5c58;--accs:#e8f1f0;--ok:#0e5c58;--okb:#eef5f4;--bad:#b42318;--badb:#fdf3f2}
*{box-sizing:border-box}html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:#ffffffeb;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--rule);padding:calc(.8em + env(safe-area-inset-top)) 1.25em .8em}
.hd{max-width:680px;margin:auto;display:flex;align-items:center;gap:1.2em}.hd b{flex:1;font-size:.95rem;font-weight:600;cursor:pointer}.hd b i{font-style:normal;font-weight:400;color:var(--mut)}
.chip{font-size:.82rem;color:var(--mut);cursor:pointer}.chip em{font-style:normal;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;margin-left:.2em}
main{max-width:680px;margin:auto;padding:2em 1.25em 4em}
.prog{margin-bottom:2em}.pt{display:flex;justify-content:space-between;align-items:baseline;font-size:.82rem;color:var(--mut);margin-bottom:.6em;font-variant-numeric:tabular-nums}.pt b{color:var(--ink);font-weight:600}
.bar{height:3px;background:var(--rule);border-radius:2px;overflow:hidden}.bar div{height:100%;background:var(--acc);transition:width .3s}
.tags{display:flex;gap:1em;align-items:center;flex-wrap:wrap;margin-bottom:1em;font-size:.8rem;color:var(--mut)}.tag{font-weight:600;color:var(--ink2)}.tag.d,.tag.m{font-weight:400;color:var(--mut)}
.star{margin-left:auto;background:none;border:0;font-size:1.2rem;line-height:1;cursor:pointer;color:#c5c9cf;padding:.2em;min-height:0;width:auto}.star.on{color:var(--acc)}.star:hover{background:none}
.qt{font-size:1.1rem;line-height:1.7;margin:0 0 1.6em;font-weight:500;letter-spacing:-.003em}
.hint{font-size:.8rem;color:var(--mut);margin:-1em 0 .8em}
.opt{display:flex;gap:.9em;align-items:flex-start;padding:.9em 1em;margin:.5em 0;border:1px solid var(--rule);border-radius:10px;cursor:pointer;font-size:.95rem;color:var(--ink2);transition:border-color .12s,background .12s}
.opt:hover{border-color:#d5d9de}.opt input{display:none}
.opt .k{flex:none;width:1.55em;height:1.55em;margin-top:.1em;border:1px solid #cfd3d8;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:600;color:var(--mut)}
.multi .opt .k{border-radius:4px}
.opt.sel{border-color:var(--acc);background:var(--accs);color:var(--ink)}.opt.sel .k{background:var(--acc);border-color:var(--acc);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okb);color:var(--ink)}.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badb)}.opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}
button{font:inherit;font-size:.95rem;font-weight:600;min-height:46px;padding:.65em 1.4em;border:1px solid var(--acc);border-radius:10px;cursor:pointer;background:var(--acc);color:#fff;transition:opacity .12s}
button:hover{opacity:.92}button:disabled{opacity:.3;cursor:default}
button.sec{background:none;color:var(--ink2);border-color:var(--rule)}button.sec:hover{background:var(--soft);opacity:1}
button.ghost{background:none;border:0;color:var(--mut);padding:.4em 0;font-weight:400;min-height:0;font-size:.85rem}
.row{display:flex;gap:.7em;margin-top:1.8em}.row button{flex:1}
.fb{margin-top:1.8em;padding-top:1.4em;border-top:1px solid var(--rule)}
.fb h3{margin:0 0 .3em;font-size:1rem;font-weight:600}.fb.ok h3{color:var(--ok)}.fb.bad h3{color:var(--bad)}
.pdf{display:inline-block;color:var(--acc);font-size:.88rem;font-weight:500;margin:.4em 0;text-decoration:none}.pdf:hover{text-decoration:underline}
details{margin-top:.6em}summary{cursor:pointer;font-weight:500;font-size:.88rem;color:var(--ink2)}
.ex{margin-top:.6em;padding:.8em 1em;background:var(--soft);border-radius:10px;max-height:55vh;overflow:auto;font-size:.87rem;color:var(--ink2)}.ex p{margin:.4em 0}.meta{color:var(--mut);font-size:.84rem}
.login{max-width:320px;margin:18vh auto 0}
.logo{font-size:.78rem;font-weight:600;color:var(--acc);margin-bottom:.8em;letter-spacing:.02em}
.login h2{margin:0;font-size:1.75rem;font-weight:600;letter-spacing:-.01em}.sub{color:var(--mut);font-size:.85rem;margin:.4em 0 2.2em}
.login input{width:100%;padding:.8em 1em;font-size:1rem;border:1px solid #d5d9de;border-radius:10px;outline:none;background:#fff;color:var(--ink)}.login input:focus{border-color:var(--acc)}
.login button{width:100%;margin-top:.9em}#pe{color:var(--bad);font-size:.84rem;min-height:1.2em;margin-top:.7em}
.home h2{margin:0;font-size:1.75rem;font-weight:600;letter-spacing:-.01em}.home>.meta{margin-top:.3em}
.stats{display:flex;gap:2.4em;margin:2em 0 2.2em}.st b{display:block;font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}.st small{color:var(--mut);font-size:.78rem}
.mi{display:flex;width:100%;align-items:center;gap:1em;text-align:left;background:none;color:var(--ink);border:0;border-top:1px solid var(--rule);border-radius:0;padding:1.05em 0;min-height:0;font-weight:400}
.menu .mi:last-child{border-bottom:1px solid var(--rule)}.mi:hover{opacity:1;background:none}.mi:hover b{color:var(--acc)}.mi:disabled{opacity:.35}
.mi .ic{display:none}.mi b{display:block;font-size:1rem;font-weight:600}.mi small{color:var(--mut);font-size:.82rem}
.mi .go{margin-left:auto;color:#c5c9cf;font-size:1.2rem}.mi.hi b{color:var(--acc)}
.big{font-size:3rem;line-height:1;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.big small{font-size:.95rem;font-weight:400;color:var(--mut);margin-left:.5em;letter-spacing:0}
.dr{margin:1.1em 0}.dr .pt{margin-bottom:.4em;font-size:.84rem}.dr .pt span{color:var(--ink2)}
@media(max-width:600px){main{padding:1.5em 1.2em 3.5em}.qt{font-size:1.06rem}}
</style></head><body>
<header><div class="hd"><b onclick="home()">AIP-C01 <i>刷题</i></b><span class="chip" id="cw" onclick="startMode('wrong')"></span><span class="chip" id="cm" onclick="startMode('mark')"></span></div></header>
<main><div class="card" id="app"></div></main><script>
// ===== Password: change it here =====
const QUIZ_PASSWORD="1234";
const PDF_URL="AIP-C01-ExamTopics.pdf";
const BANK_URL="question-bank.json";
const KEY="aipc01-progress-v1";
let Q=[],byId={},S,mode,list=[],k=0,sess,done=false;
const app=document.getElementById('app');
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}S=Object.assign({pos:0,ans:{},wrong:{},marks:[]},S||{})}
function save(){localStorage.setItem(KEY,JSON.stringify(S));chips()}
function chips(){const w=Object.keys(S.wrong).length,m=S.marks.length;document.getElementById('cw').innerHTML='错题<em>'+w+'</em>';document.getElementById('cm').innerHTML='收藏<em>'+m+'</em>';document.querySelector('header').style.display=''}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function md(t){return esc(t).split(/\n{2,}/).map(x=>'<p>'+x.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')+'</p>').join('')}
function home(){if(!Q.length)return;scrollTo(0,0);const a=Object.values(S.ans),c=a.filter(x=>x.ok).length,w=Object.keys(S.wrong).length,m=S.marks.length,has=S.pos>0&&S.pos<Q.length;
app.className='card home';app.innerHTML=`<h2>练习</h2><div class="meta">AWS Generative AI Developer – Professional · ${Q.length} 题</div>
<div class="stats"><div class="st"><b>${a.length}</b><small>已做</small></div><div class="st"><b>${a.length?Math.round(c*100/a.length):0}%</b><small>正确率</small></div><div class="st"><b>${w}</b><small>待复习错题</small></div></div>
<div class="menu">${has?`<button class="mi hi" onclick="startMode('all',true)"><span class="ic" style="background:#4f46e5;color:#fff">▶</span><span><b>继续上次进度</b><small>第 ${S.pos+1} / ${Q.length} 题</small></span><span class="go">›</span></button>`:''}
<button class="mi" onclick="startMode('all',false)"><span class="ic" style="background:#eef2ff">📘</span><span><b>${has?'从头开始':'顺序练习'}</b><small>按题号逐题练习，进度自动保存</small></span><span class="go">›</span></button>
<button class="mi" onclick="startMode('wrong')" ${w?'':'disabled'}><span class="ic" style="background:#fff1f2">🔁</span><span><b>错题重练 (${w})</b><small>答错的题优先出现，连续答对 2 次移出</small></span><span class="go">›</span></button>
<button class="mi" onclick="startMode('mark')" ${m?'':'disabled'}><span class="ic" style="background:#fef3c7">★</span><span><b>收藏 (${m})</b><small>只练习已收藏的题目</small></span><span class="go">›</span></button></div>
${a.length?'<div class="row"><button class="ghost" onclick="if(confirm(\'清除全部进度、错题和收藏？\')){localStorage.removeItem(KEY);load();chips();home()}">重置所有进度</button></div>':''}`}
function startMode(md,resume){if(!Q.length)return;mode=md;sess={c:0,t:0,stats:{}};
if(md==='all'){if(!resume)S.pos=0;list=Q.map((_,x)=>x);k=S.pos}
else if(md==='wrong'){list=Object.entries(S.wrong).sort((a,b)=>a[1].box-b[1].box||a[1].t-b[1].t).map(e=>byId[e[0]]).filter(x=>x!=null);k=0}
else{list=S.marks.map(id=>byId[id]).filter(x=>x!=null);k=0}
if(!list.length)return home();save();show()}
const MN={all:'顺序练习',wrong:'错题重练',mark:'收藏'};
function show(){scrollTo(0,0);done=false;app.className='card';const q=Q[list[k]],multi=q.answer.length>1,mk=S.marks.includes(q.id);
app.innerHTML=`<div class="prog"><div class="pt"><b>第 ${k+1} / ${list.length} 题${mode==='all'?'':' · '+MN[mode]}</b><span>本次 ${sess.c}/${sess.t}</span></div><div class="bar"><div style="width:${((k+1)/list.length*100).toFixed(1)}%"></div></div></div>
<div class="tags"><span class="tag">${q.id}</span><span class="tag d">${esc(q.domain)}</span>${multi?`<span class="tag m">多选 ${q.answer.length}</span>`:''}<button class="star ${mk?'on':''}" id="st" onclick="mark('${q.id}')" title="收藏">${mk?'★':'☆'}</button></div>
<div class="qt">${esc(q.question)}</div>${multi?'<div class="hint">选择 '+q.answer.length+' 项</div>':''}<div class="opts ${multi?'multi':''}">`+
Object.entries(q.options).map(([o,v])=>`<label class="opt" id="l${o}"><input type="${multi?'checkbox':'radio'}" name="o" value="${o}" onchange="pick()"><span class="k">${o}</span><span>${esc(v)}</span></label>`).join('')+
`</div><div class="row" id="ac"><button class="sec" onclick="finish()">结束</button><button id="sb" onclick="check()" disabled>提交</button></div><div id="fb"></div>`}
function pick(){document.querySelectorAll('.opt').forEach(l=>l.classList.toggle('sel',l.querySelector('input').checked));document.getElementById('sb').disabled=!document.querySelector('input:checked')}
function mark(id){const x=S.marks.indexOf(id);x<0?S.marks.push(id):S.marks.splice(x,1);save();const b=document.getElementById('st');if(b){b.classList.toggle('on',x<0);b.textContent=x<0?'★':'☆'}}
function check(){if(done)return;const q=Q[list[k]];const sel=[...document.querySelectorAll('input:checked')].map(e=>e.value).sort().join('');if(!sel)return;done=true;
document.querySelectorAll("input").forEach(e=>e.disabled=true);
const ok=sel===q.answer.split('').sort().join('');sess.t++;if(ok)sess.c++;const d=sess.stats[q.domain]||(sess.stats[q.domain]={c:0,t:0});d.t++;if(ok)d.c++;
S.ans[q.id]={sel,ok,t:Date.now()};
const w=S.wrong[q.id];
if(!ok){S.wrong[q.id]={box:0,t:Date.now()};if(mode==='wrong'){const at=Math.min(k+3,list.length);list.splice(at,0,list[k])}}
else if(w){w.box++;w.t=Date.now();if(w.box>=2)delete S.wrong[q.id]}
if(mode==='all')S.pos=k+1;save();
document.querySelectorAll('.opt').forEach(l=>l.classList.remove('sel'));
for(const o of q.answer)document.getElementById('l'+o).classList.add('ok');for(const o of sel)if(!q.answer.includes(o))document.getElementById('l'+o).classList.add('bad');
const last=k+1>=list.length;
document.getElementById('ac').innerHTML=`<button class="sec" onclick="finish()">结束</button><button onclick="next()">${last?'查看结果':'下一题'}</button>`;
let note='';if(mode==='wrong')note=ok?(S.wrong[q.id]?'<div class="meta">再答对 1 次即可移出错题本</div>':'<div class="meta">已移出错题本</div>'):'<div class="meta">稍后会再次出现</div>';
document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><h3>${ok?'回答正确':'回答错误 · 正确答案 '+q.answer}</h3>${note}`+
(q.source_pdf_page?`<a class="pdf" target="_blank" rel="noopener" href="${PDF_URL}#page=${q.source_pdf_page}">查看 PDF 原文 · 第 ${q.source_pdf_page} 页 ↗</a>`:'')+
(q.explanation?`<details><summary>解析 / 讨论</summary><div class="ex"></div></details>`:'<div class="meta">原 PDF 无解析</div>')+(q.note?`<div class="meta">注：${esc(q.note)}</div>`:'')+`</div>`;
const p=document.querySelector('#fb .ex');if(p)p.innerHTML=md(q.explanation);document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'})}
function next(){k++;k<list.length?show():finish()}
function finish(){scrollTo(0,0);const t=sess.t,c=sess.c,pc=t?Math.round(c*100/t):0;
app.className='card';app.innerHTML=`<div class="logo">${MN[mode]} · 本次结果</div><div class="big">${pc}%<small>${c} / ${t}</small></div><div class="meta" style="margin:.8em 0 2.2em">${t?'':'本次未作答'}</div>`+
(t?Object.entries(sess.stats).map(([d,s])=>{const p=Math.round(s.c*100/s.t);return`<div class="dr"><div class="pt"><span>${esc(d)}</span><b>${s.c}/${s.t}</b></div><div class="bar"><div style="width:${p}%"></div></div></div>`}).join(''):'')+
`<div class="row"><button class="sec" onclick="home()">返回首页</button><button onclick="startMode('${mode}',${mode==='all'})">${mode==='all'?'继续练习':'再来一轮'}</button></div>`}
function start(){load();chips();fetch(BANK_URL).then(r=>r.json()).then(d=>{Q=d.questions.filter(q=>q.answer);Q.forEach((q,x)=>byId[q.id]=x);home()}).catch(e=>app.innerHTML="题库加载失败: "+esc(e))}
function gate(){if(sessionStorage.getItem("qa")==="1")return start();document.querySelector("header").style.display="none";app.className="card login";app.innerHTML='<div class="logo">AWS · AIP-C01</div><h2>GenAI 刷题</h2><p class="sub">AIP-C01 · Generative AI Developer – Professional</p><input id="pw" type="password" inputmode="numeric" placeholder="输入密码" autocomplete="current-password"><button id="ub" onclick="tryPw()">进入练习</button><div id="pe"></div>';const e=document.getElementById("pw");e.focus();e.onkeydown=x=>{if(x.key==="Enter")tryPw()}}
function tryPw(){if(document.getElementById("pw").value===QUIZ_PASSWORD){sessionStorage.setItem("qa","1");start()}else{document.getElementById("pe").textContent="密码不正确，请重试";document.getElementById("pw").select()}}
gate();</script></body></html>
