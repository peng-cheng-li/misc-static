<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e9f1f0"><title>AIP-C01 Practice</title><style>:root{--bg:#fff;--ink:#111418;--ink2:#3d434b;--mut:#8b9098;--rule:#ebedf0;--soft:#f6f7f8;--acc:#0e5c58;--accs:#e8f1f0;--ok:#0e5c58;--okb:#eef5f4;--bad:#b42318;--badb:#fdf3f2}

.hd{max-width:680px;margin:auto;display:flex;align-items:center;gap:1.2em}.hd b{flex:1;font-size:.95rem;font-weight:600;cursor:pointer}.hd b i{font-style:normal;font-weight:400;color:var(--mut)}

.multi .opt .k{border-radius:4px}
.opt.sel{border-color:var(--acc);background:var(--accs);color:var(--ink)}.opt.sel .k{background:var(--acc);border-color:var(--acc);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okb);color:var(--ink)}.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badb)}.opt.bad .k{background:var(--bad);border-color:var(--bad);color:#fff}

button:hover{opacity:.92}button:disabled{opacity:.3;cursor:default}
button.sec{background:none;color:var(--ink2);border-color:var(--rule)}button.sec:hover{background:var(--soft);opacity:1}
button.ghost{background:none;border:0;color:var(--mut);padding:.4em 0;font-weight:400;min-height:0;font-size:.85rem}

.pdf{display:inline-block;color:var(--acc);font-size:.88rem;font-weight:500;margin:.4em 0;text-decoration:none}.pdf:hover{text-decoration:underline}
details{margin-top:.6em}summary{cursor:pointer;font-weight:500;font-size:.88rem;color:var(--ink2)}
.ex{margin-top:.6em;padding:.8em 1em;background:var(--soft);border-radius:10px;max-height:55vh;overflow:auto;font-size:.87rem;color:var(--ink2)}.ex p{margin:.4em 0}.meta{color:var(--mut);font-size:.84rem}
.login{max-width:320px;margin:18vh auto 0}
.logo{font-size:.78rem;font-weight:600;color:var(--acc);margin-bottom:.8em;letter-spacing:.02em}
.login h2{margin:0;font-size:1.75rem;font-weight:600;letter-spacing:-.01em}.sub{color:var(--mut);font-size:.85rem;margin:.4em 0 2.2em}
.login input{width:100%;padding:.8em 1em;font-size:1rem;border:1px solid #d5d9de;border-radius:10px;outline:none;background:#fff;color:var(--ink)}.login input:focus{border-color:var(--acc)}
.login button{width:100%;margin-top:.9em}#pe{color:var(--bad);font-size:.84rem;min-height:1.2em;margin-top:.7em}
.home h2{margin:0;font-size:1.75rem;font-weight:600;letter-spacing:-.01em}.home>.meta{margin-top:.3em}
.stats{display:flex;gap:2.4em;margin:2em 0 2.2em}.st b{display:block;font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}.st small{color:var(--mut);font-size:.78rem}
.mi{display:flex;width:100%;align-items:center;gap:1em;text-align:left;background:none;color:var(--ink);border:0;border-top:1px solid var(--rule);border-radius:0;padding:1.05em 0;min-height:0;font-weight:400}
.menu .mi:last-child{border-bottom:1px solid var(--rule)}.mi:hover{opacity:1;background:none}.mi:hover b{color:var(--acc)}.mi:disabled{opacity:.35}
.mi .ic{display:none}.mi b{display:block;font-size:1rem;font-weight:600}.mi small{color:var(--mut);font-size:.82rem}
.mi .go{margin-left:auto;color:#c5c9cf;font-size:1.2rem}.mi.hi b{color:var(--acc)}
.big{font-size:3rem;line-height:1;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.big small{font-size:.95rem;font-weight:400;color:var(--mut);margin-left:.5em;letter-spacing:0}
.dr{margin:1.1em 0}.dr .pt{margin-bottom:.4em;font-size:.84rem}.dr .pt span{color:var(--ink2)}

</style></head><body>
<header><div class="hd"><b onclick="home()">AIP-C01 <i>Practice</i></b><span class="chip" onclick="listView()">List</span><span class="chip" id="cw" onclick="startMode('wrong')"></span><span class="chip" id="cm" onclick="startMode('mark')"></span></div></header>
<main><div class="card" id="app"></div></main><script>
// ===== Password: change it here =====
const QUIZ_PASSWORD="1234";
const PDF_URL="AIP-C01-ExamTopics.pdf";
const BANK_URL="question-bank.json";
const KEY="aipc01-progress-v1";
let Q=[],byId={},S,mode,list=[],k=0,sess,done=false;
const app=document.getElementById('app');
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}S=Object.assign({pos:0,ans:{},wrong:{},marks:[]},S||{})}
function save(){localStorage.setItem(KEY,JSON.stringify(S));chips()}
function chips(){const w=Object.keys(S.wrong).length,m=S.marks.length;document.getElementById('cw').innerHTML='Review<em>'+w+'</em>';document.getElementById('cm').innerHTML='Saved<em>'+m+'</em>';document.querySelector('header').style.display=''}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function md(t){return esc(t).split(/\n{2,}/).map(x=>'<p>'+x.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')+'</p>').join('')}
function home(){if(!Q.length)return;scrollTo(0,0);const a=Object.values(S.ans),c=a.filter(x=>x.ok).length,w=Object.keys(S.wrong).length,m=S.marks.length,has=S.pos>0&&S.pos<Q.length;
app.className='card home';app.innerHTML=`<h2>Practice</h2><div class="meta">AWS Generative AI Developer – Professional · ${Q.length} questions</div>
<div class="stats"><div class="st"><b>${a.length}</b><small>Answered</small></div><div class="st"><b>${a.length?Math.round(c*100/a.length):0}%</b><small>Accuracy</small></div><div class="st"><b>${w}</b><small>To review</small></div></div>
<div class="menu">${has?`<button class="mi hi" onclick="startMode('all',true)"><span class="ic">▶</span><span><b>Continue where you left off</b><small>Question ${S.pos+1} of ${Q.length}</small></span><span class="go">›</span></button>`:''}
<button class="mi" onclick="startMode('all',false)"><span class="ic">≡</span><span><b>${has?'Start over':'Practice all'}</b><small>All questions in order. Progress is saved automatically.</small></span><span class="go">›</span></button>
<button class="mi" onclick="listView()"><span class="ic">#</span><span><b>Browse all questions</b><small>Numbered list. Search, filter and jump to any question.</small></span><span class="go">›</span></button>
<button class="mi" onclick="startMode('wrong')" ${w?'':'disabled'}><span class="ic">↺</span><span><b>Review mistakes (${w})</b><small>Missed questions come back first. Two correct answers in a row clears one.</small></span><span class="go">›</span></button>
<button class="mi" onclick="startMode('mark')" ${m?'':'disabled'}><span class="ic">★</span><span><b>Saved (${m})</b><small>Practice only the questions you’ve saved.</small></span><span class="go">›</span></button></div>
${a.length?'<div class="row"><button class="ghost" onclick="if(confirm(\'Clear all progress, mistakes and saved questions?\')){localStorage.removeItem(KEY);load();chips();home()}">Reset all progress</button></div>':''}`}
function startMode(md,resume){if(!Q.length)return;mode=md;sess={c:0,t:0,stats:{}};
if(md==='all'){if(!resume)S.pos=0;list=Q.map((_,x)=>x);k=S.pos}
else if(md==='wrong'){list=Object.entries(S.wrong).sort((a,b)=>a[1].box-b[1].box||a[1].t-b[1].t).map(e=>byId[e[0]]).filter(x=>x!=null);k=0}
else{list=S.marks.map(id=>byId[id]).filter(x=>x!=null);k=0}
if(!list.length)return home();save();show()}
let LF={q:'',f:'all'};
function seg(on){return `<div class="seg"><button class="${on==='card'?'on':''}" onclick="startMode('all',true)">Card</button><button class="${on==='list'?'on':''}" onclick="listView()">List</button></div>`}
function listView(){if(!Q.length)return;scrollTo(0,0);mode='all';app.className='card';
app.innerHTML=seg('list')+`<input class="lsearch" id="ls" type="search" inputmode="numeric" placeholder="Jump to question number or search text" value="${esc(LF.q)}"><div class="flt">${[['all','All'],['todo','Unanswered'],['ok','Correct'],['bad','Wrong'],['mark','Saved']].map(([k,l])=>`<button class="${LF.f===k?'on':''}" onclick="LF.f='${k}';listView()">${l}</button>`).join('')}</div><div class="lsum" id="lsum"></div><div class="ql" id="ql"></div>`;
const e=document.getElementById('ls');e.oninput=()=>{LF.q=e.value;renderList()};e.onkeydown=x=>{if(x.key==='Enter'){const n=parseInt(e.value,10);if(n>=1&&n<=Q.length)jump(n-1)}};renderList()}
function renderList(){const t=LF.q.trim().toLowerCase(),n=/^\d+$/.test(t)?parseInt(t,10):null;
const r=Q.map((q,i)=>({q,i,a:S.ans[q.id],m:S.marks.includes(q.id)})).filter(x=>{
if(LF.f==='todo'&&x.a)return false;if(LF.f==='ok'&&!(x.a&&x.a.ok))return false;if(LF.f==='bad'&&!(x.a&&!x.a.ok))return false;if(LF.f==='mark'&&!x.m)return false;
if(!t)return true;if(n!=null)return String(x.i+1).startsWith(String(n))||x.q.id.toLowerCase().includes(t);return x.q.question.toLowerCase().includes(t)||x.q.id.toLowerCase().includes(t)});
document.getElementById('lsum').textContent=r.length+' of '+Q.length+' questions';
document.getElementById('ql').innerHTML=r.map(x=>`<div class="qi" onclick="jump(${x.i})"><span class="n">${x.q.id}</span><span class="tx">${esc(x.q.question)}</span><span class="bm">${x.m?'★':''}</span><span class="s ${x.a?(x.a.ok?'ok':'bad'):'no'}">${x.a?(x.a.ok?'✓':'✕'):''}</span></div>`).join('')||'<div class="meta" style="padding:1em 0">No matching questions</div>'}
function jump(i){mode='all';sess={c:0,t:0,stats:{}};list=Q.map((_,x)=>x);k=i;S.pos=i;save();show()}
const MN={all:'All questions',wrong:'Review mistakes',mark:'Saved'};
function show(){scrollTo(0,0);done=false;app.className='card';const q=Q[list[k]],multi=q.answer.length>1,mk=S.marks.includes(q.id);
app.innerHTML=(mode==='all'?seg('card'):'')+`<div class="prog"><div class="pt"><b>Question ${k+1} / ${list.length}${mode==='all'?'':' · '+MN[mode]}</b><span>${sess.c}/${sess.t} correct</span></div><div class="bar"><div style="width:${((k+1)/list.length*100).toFixed(1)}%"></div></div></div>
<div class="tags"><span class="tag">${q.id}</span><span class="tag d">${esc(q.domain)}</span>${multi?`<span class="tag m">Choose ${q.answer.length}</span>`:''}<button class="star ${mk?'on':''}" id="st" onclick="mark('${q.id}')" title="Save question">${mk?'★':'☆'}</button></div>
<div class="qt">${esc(q.question)}</div>${multi?'<div class="hint">Select '+q.answer.length+' answers</div>':''}<div class="opts ${multi?'multi':''}">`+
Object.entries(q.options).map(([o,v])=>`<label class="opt" id="l${o}"><input type="${multi?'checkbox':'radio'}" name="o" value="${o}" onchange="pick()"><span class="k">${o}</span><span>${esc(v)}</span></label>`).join('')+
`</div><div class="row" id="ac"><button class="sec" onclick="finish()">End</button><button id="sb" onclick="check()" disabled>Submit</button></div><div id="fb"></div>`}
function pick(){document.querySelectorAll('.opt').forEach(l=>l.classList.toggle('sel',l.querySelector('input').checked));document.getElementById('sb').disabled=!document.querySelector('input:checked')}
function mark(id){const x=S.marks.indexOf(id);x<0?S.marks.push(id):S.marks.splice(x,1);save();const b=document.getElementById('st');if(b){b.classList.toggle('on',x<0);b.textContent=x<0?'★':'☆'}}
function check(){if(done)return;const q=Q[list[k]];const sel=[...document.querySelectorAll('input:checked')].map(e=>e.value).sort().join('');if(!sel)return;done=true;
document.querySelectorAll("input").forEach(e=>e.disabled=true);
const ok=sel===q.answer.split('').sort().join('');sess.t++;if(ok)sess.c++;const d=sess.stats[q.domain]||(sess.stats[q.domain]={c:0,t:0});d.t++;if(ok)d.c++;
S.ans[q.id]={sel,ok,t:Date.now()};
const w=S.wrong[q.id];
if(!ok){S.wrong[q.id]={box:0,t:Date.now()};if(mode==='wrong'){const at=Math.min(k+3,list.length);list.splice(at,0,list[k])}}
else if(w){w.box++;w.t=Date.now();if(w.box>=2)delete S.wrong[q.id]}
if(mode==='all')S.pos=k+1;save();
document.querySelectorAll('.opt').forEach(l=>l.classList.remove('sel'));
for(const o of q.answer)document.getElementById('l'+o).classList.add('ok');for(const o of sel)if(!q.answer.includes(o))document.getElementById('l'+o).classList.add('bad');
const last=k+1>=list.length;
document.getElementById('ac').innerHTML=`<button class="sec" onclick="finish()">End</button><button onclick="next()">${last?'See results':'Next'}</button>`;
let note='';if(mode==='wrong')note=ok?(S.wrong[q.id]?'<div class="meta">One more correct answer clears it</div>':'<div class="meta">Cleared from your mistakes</div>'):'<div class="meta">You’ll see this again shortly</div>';
document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><h3>${ok?'Correct':'Incorrect · Answer: '+q.answer}</h3>${note}`+
(q.source_pdf_page?`<a class="pdf" target="_blank" rel="noopener" href="${PDF_URL}#page=${q.source_pdf_page}">View in source PDF · p. ${q.source_pdf_page} ↗</a>`:'')+
(q.explanation?`<details><summary>Explanation & discussion</summary><div class="ex"></div></details>`:'<div class="meta">No explanation in the source PDF</div>')+(q.note?`<div class="meta">Note: ${esc(q.note)}</div>`:'')+`</div>`;
const p=document.querySelector('#fb .ex');if(p)p.innerHTML=md(q.explanation);document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'})}
function next(){k++;k<list.length?show():finish()}
function finish(){scrollTo(0,0);const t=sess.t,c=sess.c,pc=t?Math.round(c*100/t):0;
app.className='card';app.innerHTML=`<div class="logo">${MN[mode]} · Results</div><div class="big">${pc}%<small>${c} / ${t}</small></div><div class="meta" style="margin:.8em 0 2.2em">${t?'':'No questions answered'}</div>`+
(t?Object.entries(sess.stats).map(([d,s])=>{const p=Math.round(s.c*100/s.t);return`<div class="dr"><div class="pt"><span>${esc(d)}</span><b>${s.c}/${s.t}</b></div><div class="bar"><div style="width:${p}%"></div></div></div>`}).join(''):'')+
`<div class="row"><button class="sec" onclick="home()">Home</button><button onclick="startMode('${mode}',${mode==='all'})">${mode==='all'?'Keep going':'Go again'}</button></div>`}
function start(){load();chips();fetch(BANK_URL).then(r=>r.json()).then(d=>{Q=d.questions.filter(q=>q.answer);Q.forEach((q,x)=>byId[q.id]=x);home()}).catch(e=>app.innerHTML="Couldn’t load questions: "+esc(e))}
function gate(){if(sessionStorage.getItem("qa")==="1")return start();document.querySelector("header").style.display="none";app.className="card login";app.innerHTML='<div class="logo">AWS · AIP-C01</div><h2>GenAI Practice</h2><p class="sub">AIP-C01 · Generative AI Developer – Professional</p><input id="pw" type="password" inputmode="numeric" placeholder="Password" autocomplete="current-password"><button id="ub" onclick="tryPw()">Start practicing</button><div id="pe"></div>';const e=document.getElementById("pw");e.focus();e.onkeydown=x=>{if(x.key==="Enter")tryPw()}}
function tryPw(){if(document.getElementById("pw").value===QUIZ_PASSWORD){sessionStorage.setItem("qa","1");start()}else{document.getElementById("pe").textContent="Incorrect password. Try again.";document.getElementById("pw").select()}}
gate();</script></body></html>
