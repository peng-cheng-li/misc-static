function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}S=Object.assign({pos:0,ans:{},wrong:{},marks:[]},S||{})}
function save(){localStorage.setItem(KEY,JSON.stringify(S));chips()}
function chips(){const w=Object.keys(S.wrong).length,m=S.marks.length;document.getElementById('cw').innerHTML=t('review')+'<em>'+w+'</em>';document.getElementById('cm').innerHTML=t('saved')+'<em>'+m+'</em>';document.getElementById('cl').textContent=t('list');document.getElementById('hp').textContent=t('practice');document.querySelector('header').style.display=''}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function md(t){return esc(t).split(/\n{2,}/).map(x=>'<p>'+x.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')+'</p>').join('')}
function home(){if(!Q.length)return;view='home';scrollTo(0,0);const a=Object.values(S.ans),c=a.filter(x=>x.ok).length,w=Object.keys(S.wrong).length,m=S.marks.length,has=S.pos>0&&S.pos<Q.length;
app.className='card home';app.innerHTML=`<h2>${t('practice')}</h2><div class="meta">AWS Generative AI Developer – Professional · ${t('nq',Q.length)}</div>
<div class="stats"><div class="st"><b>${a.length}</b><small>${t('answered')}</small></div><div class="st"><b>${a.length?Math.round(c*100/a.length):0}%</b><small>${t('accuracy')}</small></div><div class="st"><b>${w}</b><small>${t('toreview')}</small></div></div>
<div class="menu">${has?`<button class="mi hi" onclick="startMode('all',true)"><span class="ic">▶</span><span><b>${t('cont')}</b><small>${t('qof',S.pos+1,Q.length)}</small></span><span class="go">›</span></button>`:''}
<button class="mi" onclick="startMode('all',false)"><span class="ic">≡</span><span><b>${has?t('over'):t('all')}</b><small>${t('alld')}</small></span><span class="go">›</span></button>
<button class="mi" onclick="listView()"><span class="ic">#</span><span><b>${t('browse')}</b><small>${t('browsed')}</small></span><span class="go">›</span></button>
<button class="mi" onclick="startMode('wrong')" ${w?'':'disabled'}><span class="ic">↺</span><span><b>${t('revm')} (${w})</b><small>${t('revmd')}</small></span><span class="go">›</span></button>
<button class="mi" onclick="startMode('mark')" ${m?'':'disabled'}><span class="ic">★</span><span><b>${t('saved')} (${m})</b><small>${t('savedd')}</small></span><span class="go">›</span></button></div>
${a.length?'<div class="row"><button class="ghost" onclick="if(confirm(t(\'resetq\'))){localStorage.removeItem(KEY);load();chips();home()}">'+t('reset')+'</button></div>':''}`}
function startMode(md,resume){if(!Q.length)return;mode=md;sess={c:0,t:0,stats:{}};
if(md==='all'){if(!resume)S.pos=0;list=Q.map((_,x)=>x);k=S.pos}
else if(md==='wrong'){list=Object.entries(S.wrong).sort((a,b)=>a[1].box-b[1].box||a[1].t-b[1].t).map(e=>byId[e[0]]).filter(x=>x!=null);k=0}
else{list=S.marks.map(id=>byId[id]).filter(x=>x!=null);k=0}
if(!list.length)return home();save();show()}
let LF={q:'',f:'all'};
function seg(on){return `<div class="seg"><button class="${on==='card'?'on':''}" onclick="startMode('all',true)">${t('card')}</button><button class="${on==='list'?'on':''}" onclick="listView()">${t('list')}</button></div>`}
function listView(){if(!Q.length)return;view='list';scrollTo(0,0);mode='all';app.className='card';
app.innerHTML=seg('list')+`<input class="lsearch" id="ls" type="search" inputmode="numeric" placeholder="${t('search')}" value="${esc(LF.q)}"><div class="flt">${[['all',t('fall')],['todo',t('ftodo')],['ok',t('fok')],['bad',t('fbad')],['mark',t('saved')]].map(([k,l])=>`<button class="${LF.f===k?'on':''}" onclick="LF.f='${k}';listView()">${l}</button>`).join('')}</div><div class="lsum" id="lsum"></div><div class="ql" id="ql"></div>`;
const e=document.getElementById('ls');e.oninput=()=>{LF.q=e.value;renderList()};e.onkeydown=x=>{if(x.key==='Enter'){const n=parseInt(e.value,10);if(n>=1&&n<=Q.length)jump(n-1)}};renderList()}
function renderList(){const t=LF.q.trim().toLowerCase(),n=/^\d+$/.test(t)?parseInt(t,10):null;
const r=Q.map((q,i)=>({q,i,a:S.ans[q.id],m:S.marks.includes(q.id)})).filter(x=>{
if(LF.f==='todo'&&x.a)return false;if(LF.f==='ok'&&!(x.a&&x.a.ok))return false;if(LF.f==='bad'&&!(x.a&&!x.a.ok))return false;if(LF.f==='mark'&&!x.m)return false;
if(!t)return true;if(n!=null)return String(x.i+1).startsWith(String(n))||x.q.id.toLowerCase().includes(t);return x.q.question.toLowerCase().includes(t)||x.q.id.toLowerCase().includes(t)});
document.getElementById('lsum').textContent=T('nofq',r.length,Q.length);
document.getElementById('ql').innerHTML=r.map(x=>`<div class="qi" onclick="jump(${x.i})"><span class="n">${x.q.id}</span><span class="tx">${esc(x.q.question)}</span><span class="bm">${x.m?'★':''}</span><span class="s ${x.a?(x.a.ok?'ok':'bad'):'no'}">${x.a?(x.a.ok?'✓':'✕'):''}</span></div>`).join('')||'<div class="meta" style="padding:1em 0">'+T('nomatch')+'</div>'}
function jump(i){mode='all';sess={c:0,t:0,stats:{}};list=Q.map((_,x)=>x);k=i;S.pos=i;save();show()}
const MN={get all(){return t('allq')},get wrong(){return t('revm')},get mark(){return t('saved')}};
function show(){view='q';scrollTo(0,0);done=false;app.className='card';const q=Q[list[k]],multi=q.answer.length>1,mk=S.marks.includes(q.id);
app.innerHTML=(mode==='all'?seg('card'):'')+`<div class="prog"><div class="pt"><b>${t('qn',k+1,list.length)}${mode==='all'?'':' · '+MN[mode]}</b><span>${t('ncorrect',sess.c,sess.t)}</span></div><div class="bar"><div style="width:${((k+1)/list.length*100).toFixed(1)}%"></div></div></div>
<div class="tags"><span class="tag">${q.id}</span><span class="tag d">${esc(q.domain)}</span>${multi?`<span class="tag m">${t('choose',q.answer.length)}</span>`:''}<button class="star ${mk?'on':''}" id="st" onclick="mark('${q.id}')" title="${t('saveq')}">${mk?'★':'☆'}</button></div>
<div class="qt">${esc(q.question)}</div>${multi?'<div class="hint">'+t('selectn',q.answer.length)+'</div>':''}<div class="opts ${multi?'multi':''}">`+
Object.entries(q.options).map(([o,v])=>`<label class="opt" id="l${o}"><input type="${multi?'checkbox':'radio'}" name="o" value="${o}" onchange="pick()"><span class="k">${o}</span><span>${esc(v)}</span></label>`).join('')+
`</div><div class="row" id="ac"><button class="sec" onclick="finish()">${t('end')}</button><button id="sb" onclick="check()" disabled>${t('submit')}</button></div><div id="fb"></div>`}
function pick(){document.querySelectorAll('.opt').forEach(l=>l.classList.toggle('sel',l.querySelector('input').checked));document.getElementById('sb').disabled=!document.querySelector('input:checked')}
function mark(id){const x=S.marks.indexOf(id);x<0?S.marks.push(id):S.marks.splice(x,1);save();const b=document.getElementById('st');if(b){b.classList.toggle('on',x<0);b.textContent=x<0?'★':'☆'}}
function check(){if(done)return;const q=Q[list[k]];const sel=[...document.querySelectorAll('input:checked')].map(e=>e.value).sort().join('');if(!sel)return;done=true;
document.querySelectorAll("input").forEach(e=>e.disabled=true);
const ok=sel===q.answer.split('').sort().join('');sess.t++;if(ok)sess.c++;const d=sess.stats[q.domain]||(sess.stats[q.domain]={c:0,t:0});d.t++;if(ok)d.c++;
S.ans[q.id]={sel,ok,t:Date.now()};
const w=S.wrong[q.id];
if(!ok){S.wrong[q.id]={box:0,t:Date.now()};if(mode==='wrong'){const at=Math.min(k+3,list.length);list.splice(at,0,list[k])}}
else if(w){w.box++;w.t=Date.now();if(w.box>=2)delete S.wrong[q.id]}
if(mode==='all')S.pos=k+1;save();
document.querySelectorAll('.opt').forEach(l=>l.classList.remove('sel'));
for(const o of q.answer)document.getElementById('l'+o).classList.add('ok');for(const o of sel)if(!q.answer.includes(o))document.getElementById('l'+o).classList.add('bad');
const last=k+1>=list.length;
document.getElementById('ac').innerHTML=`<button class="sec" onclick="finish()">${t('end')}</button><button onclick="next()">${last?t('results'):t('next')}</button>`;
let note='';if(mode==='wrong')note=ok?(S.wrong[q.id]?'<div class="meta">'+t('onemore')+'</div>':'<div class="meta">'+t('cleared')+'</div>'):'<div class="meta">'+t('again')+'</div>';
document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><h3>${ok?t('correct'):t('incorrect',q.answer)}</h3>${note}`+
(q.source_pdf_page?`<a class="pdf" target="_blank" rel="noopener" href="${PDF_URL}#page=${q.source_pdf_page}">${t('pdf',q.source_pdf_page)} ↗</a>`:'')+
(q.explanation?`<details><summary>${t('expl')}</summary><div class="ex"></div></details>`:'<div class="meta">'+t('noexpl')+'</div>')+(q.note?`<div class="meta">${t('note')}${esc(q.note)}</div>`:'')+`</div>`;
const p=document.querySelector('#fb .ex');if(p)p.innerHTML=md(q.explanation);document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'})}
function next(){k++;k<list.length?show():finish()}
function finish(){view='fin';scrollTo(0,0);const n=sess.t,c=sess.c,pc=n?Math.round(c*100/n):0;
app.className='card';app.innerHTML=`<div class="logo">${MN[mode]} · ${t('res')}</div><div class="big">${pc}%<small>${c} / ${n}</small></div><div class="meta" style="margin:.8em 0 2.2em">${n?'':T('noans')}</div>`+
(n?Object.entries(sess.stats).map(([d,s])=>{const p=Math.round(s.c*100/s.t);return`<div class="dr"><div class="pt"><span>${esc(d)}</span><b>${s.c}/${s.t}</b></div><div class="bar"><div style="width:${p}%"></div></div></div>`}).join(''):'')+
`<div class="row"><button class="sec" onclick="home()">${T('home')}</button><button onclick="startMode('${mode}',${mode==='all'})">${mode==='all'?T('keep'):T('again2')}</button></div>`}
function start(){load();chips();fetch(BANK_URL).then(r=>r.json()).then(d=>{Q=d.questions.filter(q=>q.answer);Q.forEach((q,x)=>byId[q.id]=x);home()}).catch(e=>app.innerHTML=t('loaderr')+esc(e))}
function gate(f){view='gate';if(!f&&sessionStorage.getItem("qa")==="1")return start();document.querySelector("header").style.display="none";app.className="card login";app.innerHTML='<div class="logo">AWS · AIP-C01</div><h2>GenAI Practice</h2><p class="sub">AIP-C01 · Generative AI Developer – Professional</p>'+langSeg()+'<input id="pw" type="password" inputmode="numeric" placeholder="'+t('pw')+'" autocomplete="current-password"><button id="ub" onclick="tryPw()">'+t('start')+'</button><div id="pe"></div>';const e=document.getElementById("pw");document.getElementById('lang').value=LANG;e.focus();e.onkeydown=x=>{if(x.key==="Enter")tryPw()}}
function tryPw(){if(document.getElementById("pw").value===QUIZ_PASSWORD){sessionStorage.setItem("qa","1");start()}else{document.getElementById("pe").textContent=t("pwbad");document.getElementById("pw").select()}}
setLang(LANG);gate();</script></body></html>
