<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2f2f7"><title>AIP-C01 Practice</title><style>
:root{--bg:#f2f2f7;--ink:#000;--ink2:#3c3c43;--mut:#8e8e93;--rule:#e5e5ea;--soft:#f2f2f7;--acc:#0e5c58;--accs:#e7f0ef;--ok:#0e5c58;--okb:#eef6f4;--bad:#d70015;--badb:#fdf0f1}
*{box-sizing:border-box}html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Inter,Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:#f2f2f7d9;backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid #c6c6c8;padding:calc(.7em + env(safe-area-inset-top)) 1.1em .7em}
.hd{max-width:680px;margin:auto;display:flex;align-items:center;gap:1.1em}.hd b{flex:1;font-size:1rem;font-weight:600;cursor:pointer}.hd b i{font-style:normal;font-weight:400;color:var(--mut)}
.chip{font-size:.85rem;color:var(--acc);cursor:pointer;font-weight:500}.chip em{font-style:normal;font-weight:700;margin-left:.25em;font-variant-numeric:tabular-nums}
main{max-width:680px;margin:auto;padding:1.2em 1.1em 4em}
.card{background:#fff;border-radius:20px;padding:1.3em 1.2em}
.card.home{background:none;padding:0}
.prog{margin-bottom:1.3em}.pt{display:flex;justify-content:space-between;align-items:baseline;font-size:.85rem;color:var(--mut);margin-bottom:.55em;font-variant-numeric:tabular-nums}.pt b{color:var(--acc);font-weight:600}
.bar{height:6px;background:var(--accs);border-radius:3px;overflow:hidden}.bar div{height:100%;background:var(--acc);border-radius:3px;transition:width .3s}
.tags{display:flex;gap:.5em;align-items:center;flex-wrap:wrap;margin-bottom:.9em;font-size:.78rem}.tag{font-weight:600;color:var(--acc);background:var(--accs);border-radius:999px;padding:.2em .7em}.tag.d,.tag.m{font-weight:500;color:var(--ink2);background:var(--soft)}
.star{margin-left:auto;background:none;border:0;font-size:1.35rem;line-height:1;cursor:pointer;color:#c7c7cc;padding:.1em;min-height:0;width:auto}.star.on{color:var(--acc)}
.qt{font-size:1.1rem;line-height:1.55;margin:0 0 1.3em;font-weight:600}
.hint{font-size:.82rem;color:var(--mut);margin:-.8em 0 .8em}
.opt{display:flex;gap:.85em;align-items:flex-start;padding:.9em 1em;margin:.55em 0;background:var(--soft);border:1.5px solid transparent;border-radius:14px;cursor:pointer;font-size:.95rem;color:var(--ink);transition:background .12s,border-color .12s}
.opt:hover{background:#ebebf0}.opt input{display:none}
.opt .k{flex:none;width:1.6em;height:1.6em;margin-top:.05em;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:var(--mut)}
.multi .opt .k{border-radius:6px}
.opt.sel{border-color:var(--acc);background:var(--accs)}.opt.sel .k{background:var(--acc);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badb)}.opt.bad .k{background:var(--bad);color:#fff}
button{font:inherit;font-size:1rem;font-weight:600;min-height:50px;padding:.7em 1.3em;border:0;border-radius:14px;cursor:pointer;background:var(--acc);color:#fff}
button:active{opacity:.85}button:disabled{opacity:.3;cursor:default}
button.sec{background:var(--soft);color:var(--acc)}
button.ghost{background:none;color:var(--bad);padding:.4em 0;font-weight:500;min-height:0;font-size:.95rem}
.row{display:flex;gap:.7em;margin-top:1.5em}.row button{flex:1}
.fb{margin-top:1em;padding:1.1em 1.2em;border-radius:16px;background:var(--soft)}.fb.ok{background:var(--okb)}.fb.bad{background:var(--badb)}
.fb h3{margin:0 0 .3em;font-size:1.05rem;font-weight:700}.fb.ok h3{color:var(--ok)}.fb.bad h3{color:var(--bad)}
.pdf{display:inline-block;color:var(--acc);font-size:.9rem;font-weight:600;margin:.4em 0;text-decoration:none}
details{margin-top:.5em}summary{cursor:pointer;font-weight:600;font-size:.9rem;color:var(--ink2)}
.ex{margin-top:.6em;padding:.8em 1em;background:#fff;border-radius:12px;max-height:55vh;overflow:auto;font-size:.88rem;color:var(--ink2)}.ex p{margin:.4em 0}.meta{color:var(--mut);font-size:.85rem}
.card.login{max-width:380px;margin:12vh auto 0;padding:2.2em 1.6em}
.logo{font-size:.8rem;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.02em}
.login h2,.home h2{margin:.05em 0 0;font-size:2.1rem;font-weight:700;letter-spacing:.005em}.login .meta{margin:.3em 0 1.8em}
.login input{width:100%;padding:.85em 1em;font-size:1rem;border:0;border-radius:12px;outline:none;background:var(--soft);color:var(--ink)}.login input:focus{box-shadow:0 0 0 2px var(--acc)}
.login button{width:100%;margin-top:.8em}#pe{color:var(--bad);font-size:.85rem;min-height:1.2em;margin-top:.7em}
.top{display:flex;align-items:flex-end;margin:.6em 0 1em}.top>div:first-child{flex:1}.av{flex:none;width:2.4em;height:2.4em;border-radius:50%;background:var(--acc);color:#fff;font-size:.78rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.cta{width:100%;display:flex;flex-direction:column;align-items:center;gap:.1em}.cta small{font-weight:500;opacity:.8;font-size:.8rem}
.home h4{font-size:1.3rem;font-weight:700;margin:1.4em 0 .5em}
.hc{background:#fff;border-radius:20px;padding:1em 1.1em;margin:.7em 0;display:block;width:100%;text-align:left;color:var(--ink);font-weight:400;min-height:0}
button.hc:disabled{opacity:.5}
.ch{display:flex;align-items:center;font-size:.92rem;font-weight:600;color:var(--acc)}.ch span{flex:1}.ch em{font-style:normal;color:var(--mut);font-weight:400;font-size:.85rem}
.ring{display:flex;gap:1.3em;align-items:center;margin-top:.8em}.rg{flex:none;width:6.2em;height:6.2em;border-radius:50%;display:flex;align-items:center;justify-content:center}.rg i{width:4.7em;height:4.7em;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:1.1rem}
.kv small{display:block;color:var(--mut);font-size:.78rem;font-weight:600}.kv b{font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}.kv b span{color:var(--mut);font-size:.85rem;font-weight:600}.kv>div{margin:.2em 0}
.big{font-size:2.1rem;font-weight:700;margin-top:.35em;line-height:1.1;font-variant-numeric:tabular-nums}.big small{font-size:.95rem;color:var(--mut);font-weight:600;margin-left:.25em}
.bars{display:flex;gap:5px;align-items:flex-end;height:3.2em;margin-top:.7em}.bars i{flex:1;background:var(--acc);border-radius:4px;min-height:3px}.bars i.z{background:var(--rule)}.bl{display:flex;gap:5px;margin-top:.3em}.bl span{flex:1;text-align:center;font-size:.68rem;color:var(--mut)}
.two{display:flex;gap:.7em}.two .hc{flex:1;margin:0}
.dm{padding:.75em 0;border-bottom:.5px solid var(--rule)}.dm:last-child{border:0}.dm .pt{margin-bottom:.4em}.dm .pt span{color:var(--ink);font-size:.9rem}
.big.res{font-size:3rem}
.dr{margin:1em 0}.dr .pt span{color:var(--ink)}
@media(max-width:600px){.qt{font-size:1.06rem}}
</style></head><body>
<header><div class="hd"><b onclick="home()">AIP-C01 <i>Practice</i></b><span class="chip" id="cw" onclick="startMode('wrong')"></span><span class="chip" id="cm" onclick="startMode('mark')"></span></div></header>
<main><div class="card" id="app"></div></main><script>
// ===== Password: change it here =====
const QUIZ_PASSWORD="1234";
const PDF_URL="AIP-C01-ExamTopics.pdf";
const BANK_URL="question-bank.json";
const KEY="aipc01-progress-v1";
let Q=[],byId={},S,mode,list=[],k=0,sess,done=false;
const app=document.getElementById('app');
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}S=Object.assign({pos:0,ans:{},wrong:{},marks:[]},S||{})}
function save(){localStorage.setItem(KEY,JSON.stringify(S));chips()}
function chips(){const w=Object.keys(S.wrong).length,m=S.marks.length;document.getElementById('cw').innerHTML='Review<em>'+w+'</em>';document.getElementById('cm').innerHTML='Saved<em>'+m+'</em>';document.querySelector('header').style.display=''}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function md(t){return esc(t).split(/\n{2,}/).map(x=>'<p>'+x.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')+'</p>').join('')}
function home(){if(!Q.length)return;scrollTo(0,0);const A=S.ans,ids=Object.keys(A),a=ids.length,c=ids.filter(i=>A[i].ok).length,w=Object.keys(S.wrong).length,m=S.marks.length,has=S.pos>0&&S.pos<Q.length,pc=a?Math.round(c*100/a):0,done=Math.round(a*100/Q.length);
const day=864e5,t0=new Date();t0.setHours(0,0,0,0);const wk=[0,0,0,0,0,0,0];ids.forEach(i=>{const d=Math.floor((t0-new Date(A[i].t).setHours(0,0,0,0))/day);if(d>=0&&d<7)wk[6-d]++});const mx=Math.max(1,...wk),wt=wk.reduce((x,y)=>x+y,0),dn=['S','M','T','W','T','F','S'];
const dom={};ids.forEach(i=>{const q=Q[byId[i]];if(!q)return;const d=dom[q.domain]||(dom[q.domain]={c:0,t:0});d.t++;if(A[i].ok)d.c++});
const date=new Date().toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'}).toUpperCase();
app.className='card home';app.innerHTML=`<div class="top"><div><div class="logo">${date}</div><h2>Summary</h2></div><div class="av">AIP</div></div>
<button class="cta" onclick="startMode('all',${has})">${has?`▶ Continue<small>Question ${S.pos+1} of ${Q.length}</small>`:`▶ ${a?'Start over':'Start practicing'}<small>${Q.length} questions in order</small>`}</button>
<h4>Overview</h4><div class="hc"><div class="ch"><span>◎ Overall Progress</span><em>${done}% complete</em></div><div class="ring"><div class="rg" style="background:conic-gradient(var(--acc) 0 ${done}%,var(--accs) 0)"><i>${done}%</i></div><div class="kv"><div><small>Answered</small><b>${a}<span> / ${Q.length}</span></b></div><div><small>Accuracy</small><b style="color:var(--acc)">${a?pc+'%':'—'}</b></div></div></div></div>
<div class="hc"><div class="ch"><span>▮ Last 7 Days</span></div><div class="big">${wt}<small>answered</small></div><div class="bars">${wk.map(v=>`<i class="${v?'':'z'}" style="height:${v?Math.max(8,v/mx*100):6}%"></i>`).join('')}</div><div class="bl">${wk.map((v,j)=>`<span>${dn[new Date(t0-(6-j)*day).getDay()]}</span>`).join('')}</div></div>
<div class="two"><button class="hc" onclick="startMode('wrong')" ${w?'':'disabled'}><div class="ch"><span>↺ Mistakes</span><em>›</em></div><div class="big">${w}<small>to review</small></div></button><button class="hc" onclick="startMode('mark')" ${m?'':'disabled'}><div class="ch"><span>★ Saved</span><em>›</em></div><div class="big">${m}<small>saved</small></div></button></div>
${has?`<button class="hc" onclick="startMode('all',false)"><div class="ch"><span>≡ Start Over</span><em>›</em></div><div class="meta" style="margin-top:.3em">Practice all ${Q.length} questions from the beginning.</div></button>`:''}
<h4>By Domain</h4><div class="hc">${Object.keys(dom).length?Object.entries(dom).map(([d,s])=>{const p=Math.round(s.c*100/s.t);return`<div class="dm"><div class="pt"><span>${esc(d)}</span><b>${p}%</b></div><div class="bar"><div style="width:${p}%"></div></div></div>`}).join(''):'<div class="meta">Answer some questions to see your scores by domain.</div>'}</div>
${a?'<div class="row" style="justify-content:center"><button class="ghost" onclick="if(confirm(\'Clear all progress, mistakes and saved questions?\')){localStorage.removeItem(KEY);load();chips();home()}">Reset All Progress</button></div>':''}`}
function startMode(md,resume){if(!Q.length)return;mode=md;sess={c:0,t:0,stats:{}};
if(md==='all'){if(!resume)S.pos=0;list=Q.map((_,x)=>x);k=S.pos}
else if(md==='wrong'){list=Object.entries(S.wrong).sort((a,b)=>a[1].box-b[1].box||a[1].t-b[1].t).map(e=>byId[e[0]]).filter(x=>x!=null);k=0}
else{list=S.marks.map(id=>byId[id]).filter(x=>x!=null);k=0}
if(!list.length)return home();save();show()}
const MN={all:'All questions',wrong:'Review mistakes',mark:'Saved'};
function show(){scrollTo(0,0);done=false;app.className='card';const q=Q[list[k]],multi=q.answer.length>1,mk=S.marks.includes(q.id);
app.innerHTML=`<div class="prog"><div class="pt"><b>Question ${k+1} / ${list.length}${mode==='all'?'':' · '+MN[mode]}</b><span>${sess.c}/${sess.t} correct</span></div><div class="bar"><div style="width:${((k+1)/list.length*100).toFixed(1)}%"></div></div></div>
<div class="tags"><span class="tag">${q.id}</span><span class="tag d">${esc(q.domain)}</span>${multi?`<span class="tag m">Choose ${q.answer.length}</span>`:''}<button class="star ${mk?'on':''}" id="st" onclick="mark('${q.id}')" title="Save question">${mk?'★':'☆'}</button></div>
<div class="qt">${esc(q.question)}</div>${multi?'<div class="hint">Select '+q.answer.length+' answers</div>':''}<div class="opts ${multi?'multi':''}">`+
Object.entries(q.options).map(([o,v])=>`<label class="opt" id="l${o}"><input type="${multi?'checkbox':'radio'}" name="o" value="${o}" onchange="pick()"><span class="k">${o}</span><span>${esc(v)}</span></label>`).join('')+
`</div><div class="row" id="ac"><button class="sec" onclick="finish()">End</button><button id="sb" onclick="check()" disabled>Submit</button></div><div id="fb"></div>`}
function pick(){document.querySelectorAll('.opt').forEach(l=>l.classList.toggle('sel',l.querySelector('input').checked));document.getElementById('sb').disabled=!document.querySelector('input:checked')}
function mark(id){const x=S.marks.indexOf(id);x<0?S.marks.push(id):S.marks.splice(x,1);save();const b=document.getElementById('st');if(b){b.classList.toggle('on',x<0);b.textContent=x<0?'★':'☆'}}
function check(){if(done)return;const q=Q[list[k]];const sel=[...document.querySelectorAll('input:checked')].map(e=>e.value).sort().join('');if(!sel)return;done=true;
document.querySelectorAll("input").forEach(e=>e.disabled=true);
const ok=sel===q.answer.split('').sort().join('');sess.t++;if(ok)sess.c++;const d=sess.stats[q.domain]||(sess.stats[q.domain]={c:0,t:0});d.t++;if(ok)d.c++;
S.ans[q.id]={sel,ok,t:Date.now()};
const w=S.wrong[q.id];
if(!ok){S.wrong[q.id]={box:0,t:Date.now()};if(mode==='wrong'){const at=Math.min(k+3,list.length);list.splice(at,0,list[k])}}
else if(w){w.box++;w.t=Date.now();if(w.box>=2)delete S.wrong[q.id]}
if(mode==='all')S.pos=k+1;save();
document.querySelectorAll('.opt').forEach(l=>l.classList.remove('sel'));
for(const o of q.answer)document.getElementById('l'+o).classList.add('ok');for(const o of sel)if(!q.answer.includes(o))document.getElementById('l'+o).classList.add('bad');
const last=k+1>=list.length;
document.getElementById('ac').innerHTML=`<button class="sec" onclick="finish()">End</button><button onclick="next()">${last?'See results':'Next'}</button>`;
let note='';if(mode==='wrong')note=ok?(S.wrong[q.id]?'<div class="meta">One more correct answer clears it</div>':'<div class="meta">Cleared from your mistakes</div>'):'<div class="meta">You’ll see this again shortly</div>';
document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><h3>${ok?'Correct':'Incorrect · Answer: '+q.answer}</h3>${note}`+
(q.source_pdf_page?`<a class="pdf" target="_blank" rel="noopener" href="${PDF_URL}#page=${q.source_pdf_page}">View in source PDF · p. ${q.source_pdf_page} ↗</a>`:'')+
(q.explanation?`<details><summary>Explanation & discussion</summary><div class="ex"></div></details>`:'<div class="meta">No explanation in the source PDF</div>')+(q.note?`<div class="meta">Note: ${esc(q.note)}</div>`:'')+`</div>`;
const p=document.querySelector('#fb .ex');if(p)p.innerHTML=md(q.explanation);document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'})}
function next(){k++;k<list.length?show():finish()}
function finish(){scrollTo(0,0);const t=sess.t,c=sess.c,pc=t?Math.round(c*100/t):0;
app.className='card';app.innerHTML=`<div class="logo">${MN[mode]} · Results</div><div class="big res">${pc}%<small>${c} / ${t}</small></div><div class="meta" style="margin:.8em 0 2.2em">${t?'':'No questions answered'}</div>`+
(t?Object.entries(sess.stats).map(([d,s])=>{const p=Math.round(s.c*100/s.t);return`<div class="dr"><div class="pt"><span>${esc(d)}</span><b>${s.c}/${s.t}</b></div><div class="bar"><div style="width:${p}%"></div></div></div>`}).join(''):'')+
`<div class="row"><button class="sec" onclick="home()">Home</button><button onclick="startMode('${mode}',${mode==='all'})">${mode==='all'?'Keep going':'Go again'}</button></div>`}
function start(){load();chips();fetch(BANK_URL).then(r=>r.json()).then(d=>{Q=d.questions.filter(q=>q.answer);Q.forEach((q,x)=>byId[q.id]=x);home()}).catch(e=>app.innerHTML="Couldn’t load questions: "+esc(e))}
function gate(){if(sessionStorage.getItem("qa")==="1")return start();document.querySelector("header").style.display="none";app.className="card login";app.innerHTML='<div class="logo">AWS · AIP-C01</div><h2>GenAI Practice</h2><p class="sub">AIP-C01 · Generative AI Developer – Professional</p><input id="pw" type="password" inputmode="numeric" placeholder="Password" autocomplete="current-password"><button id="ub" onclick="tryPw()">Start practicing</button><div id="pe"></div>';const e=document.getElementById("pw");e.focus();e.onkeydown=x=>{if(x.key==="Enter")tryPw()}}
function tryPw(){if(document.getElementById("pw").value===QUIZ_PASSWORD){sessionStorage.setItem("qa","1");start()}else{document.getElementById("pe").textContent="Incorrect password. Try again.";document.getElementById("pw").select()}}
gate();</script></body></html>
